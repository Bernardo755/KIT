<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Page Exporter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.3) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.3) 0, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 1);
        }

        /* Drag & Drop visual feedback */
        .drag-over {
            border-color: #3b82f6 !important;
            background: rgba(59, 130, 246, 0.1) !important;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-2">
                PDF Page Exporter
            </h1>
            <p class="text-slate-400">Convierte y renombra fácilmente las páginas de tu PDF a imágenes.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Configuration -->
            <div class="lg:col-span-4 space-y-6">
                
                <!-- File Upload Panel -->
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                        <i class="ph ph-file-pdf text-blue-400"></i> Archivo
                    </h2>
                    
                    <div id="drop-zone" class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-500/5 transition-all duration-300">
                        <i class="ph ph-upload-simple text-4xl text-slate-400 mb-3 block"></i>
                        <p class="text-sm text-slate-300 font-medium mb-1">Haz clic o arrastra tu PDF aquí</p>
                        <p class="text-xs text-slate-500">Solo archivos .pdf</p>
                        <input type="file" id="pdf-upload" accept=".pdf" class="hidden">
                    </div>
                    
                    <div id="file-info" class="hidden mt-4 bg-slate-800/50 rounded-lg p-3 flex items-center justify-between border border-slate-700">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <i class="ph ph-file-text text-blue-400 text-xl"></i>
                            <div class="truncate">
                                <p id="file-name-display" class="text-sm font-medium text-slate-200 truncate"></p>
                                <p id="file-pages-display" class="text-xs text-slate-400"></p>
                            </div>
                        </div>
                        <button id="remove-file-btn" class="text-slate-400 hover:text-red-400 transition-colors p-1" title="Quitar archivo">
                            <i class="ph ph-x-circle text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Settings Panel -->
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                        <i class="ph ph-sliders text-purple-400"></i> Configuración de Nombres
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- Main Name -->
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Nombre Principal</label>
                            <input type="text" id="config-main-name" value="documento" placeholder="Ej: factura" class="glass-input w-full rounded-lg px-4 py-2.5 text-sm">
                        </div>

                        <!-- Separator -->
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Separador</label>
                            <div class="relative">
                                <select id="config-separator" class="glass-input w-full rounded-lg px-4 py-2.5 text-sm appearance-none">
                                    <option value="_">Guion bajo (_)</option>
                                    <option value="-">Guion medio (-)</option>
                                    <option value=" ">Espacio ( )</option>
                                    <option value="custom">Personalizado...</option>
                                </select>
                                <i class="ph ph-caret-down absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>

                        <!-- Custom Separator (Hidden by default) -->
                        <div id="custom-separator-container" class="hidden">
                            <label class="block text-sm font-medium text-slate-300 mb-1">Escribe tu separador</label>
                            <input type="text" id="config-custom-separator" placeholder="Ej: ~" class="glass-input w-full rounded-lg px-4 py-2.5 text-sm">
                        </div>

                        <!-- Extension -->
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Formato de Imagen</label>
                            <div class="relative">
                                <select id="config-extension" class="glass-input w-full rounded-lg px-4 py-2.5 text-sm appearance-none">
                                    <option value="jpeg">JPEG (Recomendado)</option>
                                    <option value="png">PNG (Alta calidad)</option>
                                    <option value="webp">WebP (Optimizado)</option>
                                </select>
                                <i class="ph ph-caret-down absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Column: Pages List -->
            <div class="lg:col-span-8 flex flex-col h-[calc(100vh-8rem)] min-h-[500px]">
                <div class="glass-panel rounded-2xl p-1 flex-1 flex flex-col overflow-hidden relative">
                    
                    <!-- Header of List -->
                    <div class="p-5 border-b border-white/10 flex justify-between items-center bg-slate-900/40 rounded-t-xl">
                        <h2 class="text-xl font-semibold flex items-center gap-2">
                            <i class="ph ph-list-numbers text-blue-400"></i> Páginas del PDF
                        </h2>
                        <span id="page-count-badge" class="bg-blue-500/20 text-blue-300 text-xs font-bold px-3 py-1 rounded-full border border-blue-500/30">
                            0 páginas
                        </span>
                    </div>

                    <!-- Dynamic List Container -->
                    <div id="pages-list" class="flex-1 overflow-y-auto custom-scrollbar p-5 space-y-3">
                        <!-- Empty State -->
                        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-500">
                            <i class="ph ph-empty text-6xl mb-4 opacity-50"></i>
                            <p class="text-lg">No hay ningún PDF cargado.</p>
                            <p class="text-sm">Carga un archivo para comenzar a renombrar.</p>
                        </div>
                    </div>

                    <!-- Footer Actions -->
                    <div class="p-5 border-t border-white/10 bg-slate-900/60 rounded-b-xl">
                        <div class="flex items-center justify-between">
                            <div class="text-sm text-slate-400">
                                <span id="ready-status">Esperando archivo...</span>
                            </div>
                            <button id="process-btn" disabled class="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-medium py-2.5 px-6 rounded-lg shadow-lg shadow-blue-500/20 transition-all flex items-center gap-2">
                                <i class="ph ph-download-simple text-lg"></i>
                                <span>Procesar y Descargar</span>
                            </button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        // Setup PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // DOM Elements
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('pdf-upload');
        const fileInfo = document.getElementById('file-info');
        const fileNameDisplay = document.getElementById('file-name-display');
        const filePagesDisplay = document.getElementById('file-pages-display');
        const removeFileBtn = document.getElementById('remove-file-btn');
        
        const configMainName = document.getElementById('config-main-name');
        const configSeparator = document.getElementById('config-separator');
        const customSeparatorContainer = document.getElementById('custom-separator-container');
        const configCustomSeparator = document.getElementById('config-custom-separator');
        const configExtension = document.getElementById('config-extension');
        
        const pagesList = document.getElementById('pages-list');
        const emptyState = document.getElementById('empty-state');
        const pageCountBadge = document.getElementById('page-count-badge');
        const processBtn = document.getElementById('process-btn');
        const readyStatus = document.getElementById('ready-status');

        // State
        let currentPdf = null;
        let pdfBytes = null;
        let totalPages = 0;
        let isProcessing = false;

        // File Upload Handlers
        dropZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (file.type !== 'application/pdf') {
                alert('Por favor, selecciona un archivo PDF válido.');
                return;
            }

            fileNameDisplay.textContent = file.name;
            dropZone.classList.add('hidden');
            fileInfo.classList.remove('hidden');
            pagesList.innerHTML = '<div class="flex justify-center items-center h-full text-blue-400"><div class="spinner mr-3"></div> Analizando PDF...</div>';

            const reader = new FileReader();
            reader.onload = async function(e) {
                const typedarray = new Uint8Array(e.target.result);
                pdfBytes = typedarray;
                
                try {
                    currentPdf = await pdfjsLib.getDocument(typedarray).promise;
                    totalPages = currentPdf.numPages;
                    filePagesDisplay.textContent = `${totalPages} página(s)`;
                    pageCountBadge.textContent = `${totalPages} página(s)`;
                    
                    renderPageInputs();
                    updateAllPreviews();
                    
                    processBtn.disabled = false;
                    readyStatus.innerHTML = `<span class="text-green-400 flex items-center gap-1"><i class="ph ph-check-circle"></i> Listo para procesar</span>`;
                } catch (error) {
                    console.error('Error loading PDF:', error);
                    pagesList.innerHTML = `<div class="text-red-400 text-center p-4">Error al leer el PDF. Asegúrate de que no esté corrupto o protegido con contraseña.</div>`;
                    resetState();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        removeFileBtn.addEventListener('click', () => {
            resetState();
        });

        function resetState() {
            currentPdf = null;
            pdfBytes = null;
            totalPages = 0;
            fileInput.value = '';
            
            dropZone.classList.remove('hidden');
            fileInfo.classList.add('hidden');
            
            pagesList.innerHTML = '';
            pagesList.appendChild(emptyState);
            pageCountBadge.textContent = '0 páginas';
            
            processBtn.disabled = true;
            readyStatus.textContent = 'Esperando archivo...';
        }

        // Configuration Listeners
        configSeparator.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customSeparatorContainer.classList.remove('hidden');
            } else {
                customSeparatorContainer.classList.add('hidden');
            }
            updateAllPreviews();
        });

        [configMainName, configCustomSeparator, configExtension].forEach(el => {
            el.addEventListener('input', updateAllPreviews);
        });

        function getActiveSeparator() {
            const sep = configSeparator.value;
            if (sep === 'custom') {
                return configCustomSeparator.value;
            }
            return sep;
        }

        function renderPageInputs() {
            pagesList.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const card = document.createElement('div');
                card.className = 'bg-slate-800/60 border border-slate-700/50 rounded-xl p-4 flex flex-col md:flex-row md:items-center gap-4 hover:bg-slate-800 transition-colors';
                
                card.innerHTML = `
                    <div class="flex-shrink-0 w-12 h-12 bg-slate-700 rounded-lg flex items-center justify-center font-bold text-lg text-slate-300">
                        ${i}
                    </div>
                    
                    <div class="flex-1 space-y-1">
                        <label class="block text-xs font-medium text-slate-400">Sub-nombre para página ${i}</label>
                        <input type="text" id="subname-${i}" value="${i}" placeholder="Ej: pagina-${i}" class="glass-input w-full rounded-md px-3 py-1.5 text-sm subname-input">
                    </div>
                    
                    <div class="flex-1 md:text-right bg-slate-900/50 p-3 rounded-lg border border-slate-700/30 overflow-hidden">
                        <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Previsualización de archivo</div>
                        <div class="text-sm font-mono text-blue-300 truncate" id="preview-${i}" title="preview">
                            ...
                        </div>
                    </div>
                `;
                
                pagesList.appendChild(card);
                
                // Add listener to specific input
                const input = card.querySelector(`#subname-${i}`);
                input.addEventListener('input', () => updatePreview(i));
            }
        }

        function updatePreview(pageIndex) {
            const mainName = configMainName.value.trim() || 'documento';
            const separator = getActiveSeparator();
            const ext = configExtension.value;
            
            const subNameInput = document.getElementById(`subname-${pageIndex}`);
            if (!subNameInput) return;
            
            const subName = subNameInput.value.trim() || pageIndex;
            const previewEl = document.getElementById(`preview-${pageIndex}`);
            
            const fileName = `${mainName}${separator}${subName}.${ext}`;
            previewEl.textContent = fileName;
            previewEl.title = fileName; // Tooltip for overflow
        }

        function updateAllPreviews() {
            if (totalPages === 0) return;
            for (let i = 1; i <= totalPages; i++) {
                updatePreview(i);
            }
        }

        // Delay helper to prevent browser from blocking multiple downloads
        const delay = ms => new Promise(res => setTimeout(res, ms));

        processBtn.addEventListener('click', async () => {
            if (!currentPdf || isProcessing) return;
            
            isProcessing = true;
            processBtn.disabled = true;
            const originalBtnContent = processBtn.innerHTML;
            
            try {
                const mainName = configMainName.value.trim() || 'documento';
                const separator = getActiveSeparator();
                const ext = configExtension.value;
                const mimeType = ext === 'png' ? 'image/png' : (ext === 'webp' ? 'image/webp' : 'image/jpeg');
                
                for (let i = 1; i <= totalPages; i++) {
                    // Update UI Progress
                    processBtn.innerHTML = `<div class="spinner"></div><span>Procesando ${i} de ${totalPages}...</span>`;
                    
                    const subName = document.getElementById(`subname-${i}`).value.trim() || i;
                    const fileName = `${mainName}${separator}${subName}.${ext}`;
                    
                    // Render page to Canvas
                    const page = await currentPdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 }); // Scale 2.0 for better quality
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    // Crucial: Fill background with white for JPEG, otherwise transparent becomes black
                    if (ext === 'jpeg') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    
                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };
                    
                    await page.render(renderContext).promise;
                    
                    // Convert to Data URL
                    const dataUrl = canvas.toDataURL(mimeType, 0.9); // 0.9 quality
                    
                    // Trigger Download
                    triggerDownload(dataUrl, fileName);
                    
                    // Small delay to allow browser to process downloads without blocking
                    await delay(400); 
                }
                
                readyStatus.innerHTML = `<span class="text-green-400 flex items-center gap-1"><i class="ph ph-check-circle"></i> ¡Descargas completadas!</span>`;
                setTimeout(() => {
                    readyStatus.innerHTML = `<span class="text-green-400 flex items-center gap-1"><i class="ph ph-check-circle"></i> Listo para procesar</span>`;
                }, 3000);

            } catch (error) {
                console.error("Error during processing:", error);
                alert("Ocurrió un error al procesar las imágenes. Revisa la consola para más detalles.");
            } finally {
                isProcessing = false;
                processBtn.disabled = false;
                processBtn.innerHTML = originalBtnContent;
            }
        });

        function triggerDownload(dataUrl, filename) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

    </script>
</body>
</html>
